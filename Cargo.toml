[workspace]
resolver = "3"
members = ["nkuplay-protocol", "nkuplay-core", "nkuplay-ui", "nkuplay-mpv", "nkuplay-dandanplay"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
bern = { version = "0.1.19" }
nkuplay-protocol = { path = "nkuplay-protocol" }
nkuplay-mpv = { path = "nkuplay-mpv" }
nkuplay-dandanplay = { path = "nkuplay-dandanplay" }
