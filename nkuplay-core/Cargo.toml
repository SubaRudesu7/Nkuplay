[package]
name = "nkuplay-core"
description = "Nkuplay: the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bern.workspace = true
nkuplay-protocol.workspace = true
nkuplay-mpv.workspace = true
nkuplay-dandanplay.workspace = true
nkuplay-danmaku.workspace = true
# 取今天是星期几、属于哪一季。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 新番列表、弹幕和媒体库的缓存文件。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 从文件名里认出作品名和集数。
regex = "1"
# 向 TMDB 取剧照。
ureq = "3"
# 看离开时的画面是不是全黑。
zune-jpeg = "0.5"
